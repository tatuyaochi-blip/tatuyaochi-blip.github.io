<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>あと2センチ 試作10</title>
<style>
  :root { --bg:#16181d; --panel:#22252c; --text:#e8e6e1; --muted:#9a9890; --accent:#4fa3ff; --hot:#ff5a4f; }
  * { box-sizing:border-box; }
  html,body { margin:0; background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,"Hiragino Sans","Yu Gothic UI",sans-serif; }
  body { padding:12px 16px 24px; overscroll-behavior:none; -webkit-user-select:none; user-select:none; touch-action:manipulation; }
  #wrap { max-width:960px; margin:0 auto; }
  canvas { width:100%; height:auto; display:block; background:#2a2d35; border-radius:8px; touch-action:none; }
  #touch { display:grid; grid-template-columns:1fr 1fr 0.4fr 1fr 1fr; gap:8px; margin-top:10px; }
  #touch button { padding:18px 4px; font-size:16px; border-radius:10px; border:1px solid #444; background:var(--panel); color:var(--text); touch-action:none; }
  #touch button.on { background:#2f5f93; border-color:var(--accent); }
  #touch #rackBtn { background:#3a4a2a; border-color:#6b8f3e; font-size:13px; padding:8px 2px; }
  #bar { display:flex; gap:8px; justify-content:space-between; align-items:center; margin-top:10px; font-size:13px; color:var(--muted); flex-wrap:wrap; }
  #bar button { background:var(--panel); color:var(--text); border:1px solid #444; border-radius:6px; padding:6px 12px; font-size:13px; }
  #tune { background:var(--panel); border-radius:8px; padding:12px; margin-top:10px; display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:8px 20px; font-size:13px; }
  #tune label { display:flex; flex-direction:column; gap:2px; }
  #tune input { width:100%; }
  #tune .row { display:flex; justify-content:space-between; }
  #tune[hidden] { display:none; }
  @media (pointer:fine) { #touch button { padding:10px 4px; font-size:14px; } }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" width="960" height="600"></canvas>
  <div id="touch">
    <button data-m="lc">左胸 A</button>
    <button data-m="la">左腕 S</button>
    <button id="rackBtn">ラック<br>アップ</button>
    <button data-m="ra">右腕 K</button>
    <button data-m="rc">右胸 L</button>
  </div>
  <div id="bar">
    <span>A/S＝左の胸/腕　K/L＝右の腕/胸　Enter＝ラックアップ　Space＝補助を呼ぶ　R/Enter＝次へ　Esc＝タイトル　ゲームパッド: LT/RT＝胸, LB/RB＝腕</span>
    <span><button id="muteBtn">音: ON [M]</button> <button id="hintBtn">ヒント: ON</button> <button id="tuneBtn">調整パネル</button></span>
  </div>
  <div id="tune" hidden></div>
</div>

function drawScene() {
  g.drawImage(IMG.bg, 0, 0, 960, 600);
  // ラック（頭側）とベンチ
  const rk = { h: (FLOOR - HOOK.y) / (1 - 0.226) }; rk.w = rk.h * IMG.rack.width / IMG.rack.height;
  g.drawImage(IMG.rack, HOOK.x - 0.745 * rk.w, HOOK.y - 0.226 * rk.h, rk.w, rk.h);
  g.drawImage(IMG.bench, BENCH.x, BENCH.y, BENCH.w, BENCH.h);
  if (showHint && screen === 'play') {
    // 重い帯・首の危険域・理想の軌道
    const y1 = CH_Y - STICK_HI * RANGE, y2 = CH_Y - STICK_LO * RANGE;
    g.fillStyle = 'rgba(255,200,60,0.14)'; g.fillRect(BX0 - 110, y1, 230, y2 - y1);
    shadowText('重い帯', BX0 + 124, (y1 + y2) / 2 + 5, 13, '#e6c25a');
    const nx = BX0 - 0.9 * XS;
    g.fillStyle = 'rgba(255,70,60,0.13)'; g.fillRect(nx - 120, CH_Y - 0.55 * RANGE, 120, 0.55 * RANGE + 20);
    shadowText('首', nx - 112, CH_Y - 0.4 * RANGE, 13, '#ff7a6b');
    g.setLineDash([4, 6]); g.strokeStyle = 'rgba(255,255,255,0.3)'; g.lineWidth = 2; g.beginPath();
    for (let k = 0; k <= 20; k++) { const hh = k / 20, p = barPos(idealX(hh), hh); k ? g.lineTo(p.x, p.y) : g.moveTo(p.x, p.y); }
    g.stroke(); g.setLineDash([]);
  }
  const anim = screen === 'accident' && S.result && !S.result.foul && !S.result.ok ? S.result.kind : null;
  const fl = anim ? Math.sin(S.anim * 22) * 0.35 * Math.max(0, 1.6 - S.anim) : 0;
  const cf = Math.max(S.fat.lc, S.fat.rc), ca = (S.act.lc + S.act.rc) / 2;
  // 脚（足はベンチの端に乗せる）
  const knee = { x: HIP.x + 56 + fl * 30, y: HIP.y - 78 - Math.abs(fl) * 40 };
  const ankle = { x: knee.x + 23 + fl * 50, y: knee.y + 73 - Math.abs(fl) * 30 };
  drawLimb('shin', knee, ankle, 0, false);
  drawLimb('thigh', HIP, knee, 0, false);
  // バーの位置（事故時はアニメ）
  let bp = barPos(), farOff = tiltV() * RANGE * 0.5;
  if (anim) {
    const k = Math.min(1, S.anim * 2.5), f0 = S.animFrom;
    const tgt = { guillotine: { x: 1.35, h: 0.0 }, belly: { x: -2.6, h: -0.1 }, crush: { x: f0.x, h: -0.04 }, shoulder: { x: f0.x - 0.4, h: 0.05 }, tilt: { x: f0.x, h: Math.max(0, f0.h - 0.3) } }[anim];
    bp = barPos(f0.x + (tgt.x - f0.x) * k, f0.h + (tgt.h - f0.h) * k);
    farOff = anim === 'tilt' ? (S.lowSide ? 1 : -1) * Math.min(90, 20 + S.anim * 120) : f0.tilt * RANGE * 0.5;
  }
  const armRed = a => clamp(S.fat[a] * 0.6 + S.act[a] * 0.1, 0, 0.75);
  const drawArm = (side, dy, dark) => {
    const a = side ? 'ra' : 'la';
    const popped = anim === 'shoulder' && (S.sh[side] >= S.sh[1 - side]);
    const sh = { x: SHX + (popped ? -20 - S.anim * 20 : 0), y: SHY + dy + (popped ? -10 : 0) };
    const hand = { x: bp.x, y: bp.y + (side ? 0 : -farOff) };
    const e = elbow(sh.x, sh.y, hand.x, hand.y);
    drawLimb('fore', e, hand, armRed(a) * 0.6, dark);
    drawLimb('upper', sh, e, armRed(a), dark);
    if (popped) shadowText('ポン', SHX - 10, SHY - 40, 20, '#ffd34d', 'center', '800');
  };
  // 奥の腕と奥のプレート
  drawArm(0, -6, true);
  plate('plateL', bp.x, bp.y - farOff, 96, 0, true);
  // 胴体（胸が疲れると赤くなる）と頭
  const tm = META.torso;
  g.drawImage(tinted('torso', 0, false, { x: tm.chest[0] * IMG.torso.width, y: tm.chest[1] * IMG.torso.height, r: IMG.torso.width * 0.22, a: clamp(cf * 0.7 + ca * 0.1, 0, 0.7) }), TORSO.x, TORSO.y, TORSO.w, TORSO.h);
  const fi = IMG['face' + faceIndex(anim)];
  const hw = HEAD.w * (anim === 'guillotine' ? 1 + 0.12 * Math.min(1, S.anim * 3) : 1), hh = hw * fi.height / fi.width;
  const shake = screen === 'play' ? Math.max(S.fat.lc, S.fat.rc, S.fat.la, S.fat.ra) * 2.2 * Math.sin(S.t * 40) : 0;
  g.drawImage(fi, HEAD.right - hw + shake, HEAD.bottom - hh, hw, hh);
  // 手前のプレートとバーの軸
  if (anim !== 'tilt') plate('plateL', bp.x, bp.y, 96);
  g.fillStyle = '#c4c8cf'; g.beginPath(); g.arc(bp.x, bp.y, 8, 0, 7); g.fill(); g.strokeStyle = '#222'; g.lineWidth = 2; g.stroke();
  drawArm(1, 0, false);
  // 落ちたプレート
  for (const p of S.plates) plate(p.img, p.x, p.y, p.r * 2, p.rot);
}

function drawFront() {
  // 正面から見たバー（左右の高さ）
  const ox = 640, oy = 24, w = 300, h = 170;
  g.fillStyle = 'rgba(8,10,14,0.72)'; g.beginPath(); g.roundRect(ox, oy, w, h, 8); g.fill();
  text('正面（左右の高さ）', ox + 10, oy + 20, 13, '#9a9890');
  g.save(); g.beginPath(); g.rect(ox, oy + 26, w, h - 26); g.clip();
  const base = oy + h - 30, sc = 100;
  let yl = base - S.h[0] * sc, yr = base - S.h[1] * sc;
  if (screen === 'accident' && S.result.kind === 'tilt') { const d = Math.min(80, S.anim * 140); if (S.lowSide) { yr += d; yl -= d * 0.5; } else { yl += d; yr -= d * 0.5; } }
  const tl = Math.abs(tiltV()), warn = tl > P.tiltLimit * 0.5;
  line(ox + 30, yl, ox + w - 30, yr, 6, warn ? '#ff7a6b' : '#c9cdd4');
  const pf = IMG.plateFront, ph = 52, pw = ph * pf.width / pf.height;
  g.drawImage(pf, ox + 22 - pw / 2, yl - ph / 2, pw, ph); g.drawImage(pf, ox + w - 22 - pw / 2, yr - ph / 2, pw, ph);
  // 手と肩
  for (let i = 0; i < 2; i++) {
    const xh = i ? ox + w - 90 : ox + 90, yh = i ? yl + (yr - yl) * (w - 120) / (w - 60) : yl + (yr - yl) * 60 / (w - 60);
    g.fillStyle = muscleColor(S.act[i ? 'ra' : 'la'], S.fat[i ? 'ra' : 'la']); g.beginPath(); g.arc(xh, yh, 7, 0, 7); g.fill();
    const s = clamp(S.sh[i], 0, 1); g.fillStyle = rgb(mix([120, 120, 130], [255, 60, 50], s)); g.beginPath(); g.arc(i ? ox + w - 110 : ox + 110, base + 8, 6 + s * 4, 0, 7); g.fill();
  }
  g.restore();
  text('左', ox + 10, oy + h - 8, 12, '#9a9890'); text('右', ox + w - 22, oy + h - 8, 12, '#9a9890');
}

function gauge(x, y, m) {
  const a = S.act[m], f = S.fat[m];
  g.fillStyle = '#1d2026'; g.beginPath(); g.roundRect(x, y, 200, 74, 8); g.fill();
  const isC = m.endsWith('c'), h = hAvg();
  const eff = isC ? curveC(h) : curveA(h), other = isC ? curveA(h) : curveC(h);
  text(`${MNAME[m]}  [${MKEY[m]}]`, x + 10, y + 20, 15, '#e8e6e1', 'left', '600');
  if (showHint && screen === 'play' && eff > other + 0.1) text('今よく効く', x + 190, y + 20, 12, '#6fd08c', 'right');
  text('力', x + 10, y + 42, 12, '#9a9890'); g.fillStyle = '#333'; g.fillRect(x + 32, y + 33, 158, 10); g.fillStyle = '#4fa3ff'; g.fillRect(x + 32, y + 33, 158 * a, 10);
  text('疲労', x + 6, y + 62, 12, '#9a9890'); g.fillStyle = '#333'; g.fillRect(x + 32, y + 53, 158, 10); g.fillStyle = f > 0.7 ? '#ff5a4f' : '#d98c3a'; g.fillRect(x + 32, y + 53, 158 * f, 10);
}

function drawHud() {
  const phaseText = { ready: '腕（S・K）を押して構えてから、Enter か「ラックアップ」でバーを外す', handoff: '補助の支えが外れていく…腕で支えて！', hold: '腕を伸ばしたまま支える（「スタート」の合図を待つ）', lower: '力を少しずつ緩めて、胸までゆっくり下ろす', pause: '胸（A・L）を押したまま胸の上で止めて、「プレス」を待つ', press: '押し上げる！', rack: '胸の力で頭側へ寄せて、ラックに戻す' }[S.phase];
  g.fillStyle = 'rgba(8,10,14,0.62)'; g.beginPath(); g.roundRect(10, 8, 262, 360, 10); g.fill();
  text(`${S.W}kg`, 20, 36, 28, '#fff', 'left', '700');
  text(mode === 'meet' ? `大会 ${meet.attempts.length + 1}本目 / 3　ライバル ${RIVAL}kg` : `練習　自己ベスト ${best || '-'}kg`, 20, 60, 14, '#9a9890');
  if (screen === 'play') wrapLines([phaseText], 244, 15).slice(0, 3).forEach((ln, i) => text(ln, 20, 88 + i * 20, 15, '#ffffff', 'left', '600'));
  text(`胸から ${Math.round(hAvg() * CM)}cm`, 20, 160, 14, '#b8b6ae');
  // 成功までの手順
  const STEPS = ['ラックアップして支える', '胸までゆっくり下ろす', '胸で止めて合図を待つ', '押し上げて伸ばしきる', 'ラックに戻す＝成功'];
  const cur = { ready: 0, handoff: 0, hold: 0, lower: 1, pause: 2, press: 3, rack: 4 }[S.phase];
  const okAll = S.result && S.result.ok;
  text('成功までの手順', 20, 190, 13, '#b8b6ae', 'left', '600');
  STEPS.forEach((st, i) => {
    const done = okAll || i < cur, now = !okAll && i === cur;
    text(`${done ? '✓' : now ? '▶' : '・'} ${i + 1}. ${st}`, 20, 212 + i * 22, 14, done ? '#6fd08c' : now ? '#ffd34d' : '#8a887f', 'left', now ? '700' : '');
  });
  if (screen === 'play' && S.phase === 'ready') button(20, 312, 240, 46, 'ラックアップ [Enter]', rackUp, true);
  if (screen === 'play' && S.phase === 'handoff') {
    const sup = clamp(1 - S.phaseT / 1.6, 0, 1);
    text('補助の支え', 20, 326, 13, '#b8b6ae'); g.fillStyle = '#333'; g.fillRect(20, 334, 240, 10); g.fillStyle = '#9ccf6a'; g.fillRect(20, 334, 240 * sup, 10);
  }
  if (screen === 'play' && S.phase === 'rack') {
    const pulse = 0.5 + 0.5 * Math.sin(S.t * 8);
    g.strokeStyle = `rgba(156,207,106,${0.4 + 0.6 * pulse})`; g.lineWidth = 4; g.beginPath(); g.arc(HOOK.x, HOOK.y, 22, 0, 7); g.stroke();
    shadowText('← ラックへ（胸を押す）', HOOK.x + 30, HOOK.y - 30, 16, '#b6e68a', 'left', '700');
  }
  if (S.call && S.callT < 1.0) shadowText(S.call, 560, 110, 54, '#ffd34d', 'center', '800');
  // 警告
  if (screen === 'play') {
    const w = [], blink = Math.sin(S.t * 18) > -0.3;
    const tl = tiltV();
    if (S.slideT > 0) w.unshift(`プレートが滑っている！ ${tl > 0 ? '右' : '左'}を緩めて！`);
    else if (Math.abs(tl) > P.tiltLimit * 0.5) w.push(`${tl > 0 ? '左' : '右'}が下がっている！`);
    if (S.x > 0.6 && hAvg() < 0.6) w.push('首の方へ流れている！');
    if (S.x < -0.45 && hAvg() < 0.6) w.push('お腹の方へ流れている！');
    for (let i = 0; i < 2; i++) if (S.sh[i] > 0.5) w.push(`${i ? '右' : '左'}肩がきしむ！`);
    for (const m of MUS) if (S.fat[m] > 0.75) w.push(`${MNAME[m]}が限界`);
    if (S.phase === 'pause' && S.sink > 0.3) w.push('沈み込みそう！胸を押して！');
    if (S.phase === 'pause' && hAvg() > 0.03) w.push('浮いている！胸を緩めて！');
    if (S.phase === 'press' && S.noProgT > 2) w.push('止まっている…');
    w.slice(0, 4).forEach((s, i) => { if (blink) shadowText(s, 940, 222 + i * 26, 18, '#ff7a6b', 'right', '700'); });
  }
  gauge(20, 508, 'lc'); gauge(230, 508, 'la'); gauge(530, 508, 'ra'); gauge(740, 508, 'rc');
}

function drawAccidentOverlay() {
  const r = S.result;
  const lights = r.ok ? ['#fff', '#fff', '#fff'] : ['#e33', '#e33', '#e33'];
  if (r.foul || r.ok || S.anim > 1.0) {
    g.fillStyle = 'rgba(10,12,16,0.82)'; g.beginPath(); g.roundRect(60, 150, 840, 260, 12); g.fill();
    lights.forEach((c, i) => { g.fillStyle = c; g.beginPath(); g.arc(420 + i * 60, 185, 14, 0, 7); g.fill(); });
    text(r.ok ? `${S.W}kg 成功！` : ACC_TITLE[r.kind], 480, 240, 34, r.ok ? '#6fd08c' : '#ff7a6b', 'center', '800');
    wrapLines(r.lines, 780, 16).forEach((s, i) => text(s, 480, 280 + i * 24, 16, '#e8e6e1', 'center'));
    if (S.anim > 0.3) text('Enter / タップで次へ', 480, 398, 14, '#9a9890', 'center');
  } else {
    text(ACC_TITLE[r.kind], 480, 200, 56, '#ffd34d', 'center', '900');
  }
}

function drawTitle() {
  g.drawImage(IMG.title, 0, 0, 960, 600); g.fillStyle = 'rgba(10,12,18,0.66)'; g.fillRect(0, 0, 960, 600);
  shadowText('あと2センチ', 480, 120, 56, '#fff', 'center', '900');
  text('筋肉操作ベンチプレス（試作）', 480, 160, 18, '#9a9890', 'center');
  const lines = [
    'A＝左胸　S＝左腕　K＝右腕　L＝右胸（長押しで力が入る。立ち上がりは少し遅い）',
    '胸：低い位置で強いが、バーを首の方へ押す癖がある',
    '腕：高い位置で強く、真上に押す。胸の近くで頼りすぎると肩が外れる',
    '途中に「重い帯」がある。胸から腕へ、早めに切り替えるのがコツ',
    '流れ：ラックアップ → 下ろす → 胸で静止して「プレス」を待つ → 押す → 「ラック」で頭側へ戻す',
    '成功＝ラックに戻すまでやりきること（審判3人の白ランプ）。途中の事故・反則は失敗',
  ];
  lines.forEach((s, i) => text(s, 480, 200 + i * 26, 16, '#e8e6e1', 'center'));
  button(260, 395, 200, 56, '練習 [1]', () => startMode('practice'), true);
  button(500, 395, 200, 56, '大会 3試技 [2]', () => startMode('meet'));
  text(`自己ベスト　重量 ${best || '-'}kg　最高点 ${bestScore ? fmt(bestScore) : '-'}点　大会トータル ${bestMeet ? fmt(bestMeet) : '-'}点`, 480, 475, 15, '#c9c6bd', 'center');
  // 記録を消す（誤って押さないよう2回押しで消える）
  if (best || bestScore || bestMeet) {
    const armed = performance.now() - clearArmed < 3000;
    button(800, 520, 140, 34, armed ? 'もう一度で消去' : '記録を消す', () => { if (armed) { clearRecords(); clearArmed = -1e9; } else clearArmed = performance.now(); });
  }
}

function drawWeight() {
  const att = mode === 'meet' ? meet.attempts : [];
  text(mode === 'meet' ? `${att.length + 1}本目の重量を申告` : '重量を選ぶ', 480, 110, 30, '#fff', 'center', '700');
  if (mode === 'meet') {
    text(`ライバルの記録 ${RIVAL}kg`, 480, 145, 16, '#d9b44a', 'center');
    att.forEach((a, i) => text(`${i + 1}本目 ${a.w}kg ${a.ok ? '○' : '×'}　${fmt(a.pts)}点`, 480, 175 + i * 22, 15, a.ok ? '#6fd08c' : '#ff7a6b', 'center'));
  }
  text(`${weight}kg`, 480, 290, 64, '#fff', 'center', '800');
  button(250, 250, 70, 56, '−10', () => adjWeight(-10)); button(640, 250, 70, 56, '＋10', () => adjWeight(10));
  button(380, 340, 200, 56, '挑戦する [Enter]', startPlay, true);
  weightChips(420);
  text('数字を押すか、↑↓ / ←→ で10kgずつ変更', 480, 488, 14, '#9a9890', 'center');
}

function drawResult() {
  const r = S.result;
  text(r.ok ? `${S.W}kg 成功` : `${S.W}kg 失敗`, 480, 80, 30, r.ok ? '#6fd08c' : '#ff7a6b', 'center', '800');
  if (bestScore) text(`自己ベスト ${best || '-'}kg / ${fmt(bestScore)}点`, 940, 30, 14, '#9a9890', 'right');
  const nr = newRec && [newRec.w && '重量', newRec.pts && '点数'].filter(Boolean);
  if (nr && nr.length) shadowText(`自己ベスト更新！（${nr.join('・')}）`, 480, 40, 18, '#ffd34d', 'center', '800');
  if (r.ok) {
    text(`スコア ${fmt(r.score.total)}点`, 480, 128, 30, '#fff', 'center', '800');
    drawScore(r.score, 148);
    text(scoreTip(r.score), 480, 256, 15, '#e6c25a', 'center', '600');
  } else {
    text('スコア 0点', 480, 128, 26, '#9a9890', 'center', '700');
    wrapLines(r.lines, 860, 16).forEach((s, i) => text(s, 480, 170 + i * 24, 16, '#e8e6e1', 'center'));
  }
  if (mode === 'practice') {
    text(`次の重量 ${weight}kg（←→で変更）`, 480, 300, 22, '#fff', 'center', '600');
    button(380, 340, 200, 56, 'もう一回 [R]', startPlay, true);
    button(240, 350, 60, 40, '−10', () => adjWeight(-10)); button(660, 350, 60, 40, '＋10', () => adjWeight(10));
    weightChips(420);
  } else button(380, 340, 200, 56, '次の申告へ', () => { screen = 'weight'; }, true);
}

function drawMeetEnd() {
  const ok = meet.attempts.filter(a => a.ok).map(a => a.w);
  const res = ok.length ? Math.max(...ok) : 0;
  text('大会結果', 480, 110, 34, '#fff', 'center', '800');
  const total = meet.attempts.reduce((s, a) => s + a.pts, 0);
  meet.attempts.forEach((a, i) => {
    text(`${i + 1}本目 ${a.w}kg ${a.ok ? '○' : '×'}`, 420, 155 + i * 28, 18, a.ok ? '#6fd08c' : '#ff7a6b', 'right');
    text(`${fmt(a.pts)}点`, 560, 155 + i * 28, 18, a.ok ? '#e8e6e1' : '#9a9890', 'right');
  });
  text(`トータルスコア ${fmt(total)}点`, 480, 268, 34, '#fff', 'center', '800');
  text('3本の点数の合計（失敗は0点）', 480, 292, 13, '#9a9890', 'center');
  text(res ? `記録 ${res}kg` : '記録なし', 480, 326, 22, '#e8e6e1', 'center', '700');
  if (newRec && newRec.meet) shadowText('大会トータルの自己ベスト更新！', 480, 70, 18, '#ffd34d', 'center', '800');
  else if (bestMeet) text(`大会トータルの自己ベスト ${fmt(bestMeet)}点`, 480, 70, 14, '#9a9890', 'center');
  text(res > RIVAL ? 'ライバルに勝った！' : res === RIVAL ? 'ライバルと同記録' : `ライバル ${RIVAL}kg に届かず`, 480, 352, 18, res > RIVAL ? '#6fd08c' : '#d9b44a', 'center', '600');
  button(380, 372, 200, 56, 'タイトルへ', goTitle, true);
}

// ===== ループ =====
let last = performance.now(), dummy = null;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (padPressed(0)) advance(); if (padPressed(1)) assist();
  if (screen === 'play') { const n = 4; for (let i = 0; i < n && screen === 'play'; i++) step(dt / n); }
  else if (screen === 'accident') {
    S.anim += dt; S.t += dt; S.callT += dt;
    for (const p of S.plates) { p.vy += 900 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vx * dt * 0.02; if (p.y > FLOOR - p.r) { if (p.vy > 80) SFX.plateHit(p.vy, p.r, p.x); p.y = FLOOR - p.r; p.vy *= -0.35; p.vx *= 0.8; } }
  }
  if (screen === 'accident' && !S.judged && (S.result.foul || S.result.ok || S.anim > 1.0)) {
    S.judged = true; const ok = S.result.ok; SFX.lights(ok);
    if (mode === 'meet' || S.result.foul) setTimeout(() => say(ok ? 'グッドリフト' : 'ノーリフト', { rate: 1.1 }), 450);
  }
  updateSound(dt);
  hits = [];
  g.clearRect(0, 0, cv.width, cv.height);
  if (screen === 'title' || screen === 'weight' || screen === 'meetEnd' || (screen === 'result')) {
    if (!S) { if (!dummy) { newAttempt(60); dummy = S; } }
    if (screen !== 'title') { drawScene(); g.fillStyle = 'rgba(22,24,29,0.85)'; g.fillRect(0, 0, 960, 600); }
    if (screen === 'title') drawTitle(); else if (screen === 'weight') drawWeight(); else if (screen === 'result') drawResult(); else drawMeetEnd();
  } else {
    drawScene(); drawFront(); drawHud();
    if (screen === 'accident') drawAccidentOverlay();
  }
  requestAnimationFrame(frame);
}
Promise.all(Object.keys(ASSETS).map(k => new Promise(res => { const im = new Image(); im.onload = im.onerror = () => res(); im.src = ASSETS[k]; IMG[k] = im; })))
  .then(() => { last = performance.now(); requestAnimationFrame(frame); });
</script>
