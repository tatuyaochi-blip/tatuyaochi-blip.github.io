<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Block Bloom</title>
<meta name="description" content="A relaxing block puzzle. Place pieces on the 8×8 garden, fill rows and columns and watch them bloom.">
<meta name="theme-color" content="#f3efe6">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext x='50' y='78' font-size='80' text-anchor='middle'%3E%F0%9F%8C%B8%3C/text%3E%3C/svg%3E">
<style>
:root { --bg: #f3efe6; --bg2: #e8e1d1; --panel: #fffdf8; --ink: #2e2a24; --muted: #7d7568; --line: #ddd3c0; --cell: #ebe4d6; --accent: #e25d8a; --accent-ink: #fff; --ok: rgba(74,170,110,.45); --bad: rgba(220,80,80,.35); --focus: #2563eb;
  --c1: #f17a8f; --c2: #f6a95b; --c3: #f2d15c; --c4: #7cc77f; --c5: #5cb8d6; --c6: #8f86e6; --c7: #d77fd0; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #1d1b22; --bg2: #16141a; --panel: #29262f; --ink: #f1ece4; --muted: #b0a79a; --line: #3d3945; --cell: #34303c; --accent: #ff86ad; --accent-ink: #26121b; --focus: #8ab4ff; } }
:root[data-theme="dark"] { --bg: #1d1b22; --bg2: #16141a; --panel: #29262f; --ink: #f1ece4; --muted: #b0a79a; --line: #3d3945; --cell: #34303c; --accent: #ff86ad; --accent-ink: #26121b; --focus: #8ab4ff; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; }
body { background: linear-gradient(180deg, var(--bg), var(--bg2)); background-color: var(--bg); color: var(--ink); font: 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: none;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
[hidden] { display: none !important; }
.app { height: 100%; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 18px; padding: 10px 16px; --cs: 52px; }
.side { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.side.l .card { width: min(100%, 230px); }
.side.l { align-items: flex-end; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 10px 14px; min-width: 150px; }
.label { font-size: .72rem; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
.big { font-size: 2rem; font-weight: 900; line-height: 1.1; }
.small { font-size: .8rem; color: var(--muted); }
.board { display: grid; grid-template-columns: repeat(8, var(--cs)); grid-template-rows: repeat(8, var(--cs)); gap: 3px; padding: 6px; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; position: relative; touch-action: none; }
.cell { border-radius: 22%; background: var(--cell); position: relative; }
.cell.f { box-shadow: inset 0 -4px 0 rgba(0,0,0,.18), inset 0 3px 0 rgba(255,255,255,.35); }
.cell.pv { outline: 3px solid var(--ok); outline-offset: -3px; background: var(--ok); }
.cell.clr::after { content: ""; position: absolute; inset: 0; border-radius: 22%; background: rgba(255,255,255,.5); }
.cell.pop { animation: pop .45s ease-out; }
@keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.18) rotate(8deg); filter: brightness(1.5); } 100% { transform: scale(1); } }
.c1 { background: var(--c1); } .c2 { background: var(--c2); } .c3 { background: var(--c3); } .c4 { background: var(--c4); } .c5 { background: var(--c5); } .c6 { background: var(--c6); } .c7 { background: var(--c7); }
.tray { display: flex; flex-direction: column; gap: 12px; align-items: flex-start; }
.slot { width: calc(var(--cs) * 3.2); height: calc(var(--cs) * 2.6); border-radius: 14px; border: 2px dashed transparent; background: var(--panel); display: grid; place-items: center; touch-action: none; padding: 0; }
.slot[aria-pressed="true"] { border-color: var(--accent); }
.slot.dead { opacity: .35; }
.piece { display: grid; gap: 2px; pointer-events: none; }
.piece i { display: block; width: calc(var(--cs) * .48); height: calc(var(--cs) * .48); border-radius: 22%; box-shadow: inset 0 -3px 0 rgba(0,0,0,.18); }
.piece i.e { background: transparent; box-shadow: none; }
.ghost { position: fixed; z-index: 20; pointer-events: none; opacity: .9; }
.ghost .piece i { width: var(--cs); height: var(--cs); }
.ghost .piece { gap: 3px; }
.float { position: absolute; z-index: 5; font-weight: 900; font-size: 1.6rem; color: var(--accent); pointer-events: none; animation: rise 1s ease-out forwards; text-shadow: 0 2px 0 var(--panel); white-space: nowrap; transform: translate(-50%, -50%); }
@keyframes rise { to { margin-top: -60px; opacity: 0; } }
.petal { position: absolute; z-index: 4; width: 10px; height: 10px; border-radius: 60% 0; pointer-events: none; animation: petal .9s ease-out forwards; }
@keyframes petal { to { transform: translate(var(--dx), var(--dy)) rotate(260deg); opacity: 0; } }
.hdr { display: none; }
.icon-btn { min-width: 40px; min-height: 40px; border-radius: 50%; border: 1px solid var(--line); background: var(--panel); }
.overlay { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(30,25,20,.55); z-index: 30; padding: 16px; }
.overlay .box { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 22px; max-width: 380px; width: 100%; text-align: center; }
.overlay h1 { font-size: 2.6rem; margin: 0; line-height: 1; }
.overlay h1 span { color: var(--accent); }
.overlay p { color: var(--muted); margin: 10px 0; }
.btn { display: block; width: 100%; min-height: 46px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); font-weight: 800; margin-top: 8px; }
.btn.go { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.res { font-size: 2.6rem; font-weight: 900; color: var(--accent); }
.combo { min-height: 1.4em; font-weight: 900; color: var(--accent); }
@media (max-width: 760px), (max-aspect-ratio: 4/5) {
  .app { grid-template-columns: 1fr; grid-template-rows: auto auto auto; align-content: start; justify-items: center; gap: 10px; padding: 8px; }
  .side.l, .side.r .card { display: none; }
  .app { align-content: center; }
  .side.r { order: 3; }
  .tray { flex-direction: row; gap: 8px; }
  .slot { width: calc(var(--cs) * 2.7); height: calc(var(--cs) * 2.4); }
  .hdr { display: flex; width: 100%; justify-content: space-between; align-items: center; gap: 8px; max-width: 520px; }
  .hdr .card { min-width: 0; flex: 1; padding: 4px 10px; }
  .hdr .big { font-size: 1.4rem; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="app" id="app">
  <div class="hdr">
    <div class="card"><div class="label">Score</div><div class="big" id="hScore">0</div></div>
    <div class="card"><div class="label">Best</div><div class="big" id="hBest">0</div></div>
    <button class="icon-btn" id="hSound" aria-label="Sound on">🔊</button>
  </div>
  <div class="side l">
    <div class="card"><div class="label">Score</div><div class="big" id="score">0</div><div class="small">Best <span id="best">0</span></div><div class="small" id="mode"></div></div>
    <div class="card"><div class="label">Combo</div><div class="combo" id="combo">–</div><div class="small">Clear lines on back-to-back moves to multiply points.</div></div>
    <button class="icon-btn" id="btnSound" aria-label="Sound on">🔊</button>
  </div>
  <div class="board" id="board" role="grid" aria-label="Garden board"></div>
  <div class="side r">
    <div class="tray" id="tray"></div>
    <div class="card small">Drag a piece onto the board.<br>Or: 1–3 pick, arrows move, Enter place.</div>
  </div>
</div>

<div class="overlay" id="oTitle">
  <div class="box">
    <div style="font-size:2.6rem">🌸🌼🌷</div>
    <h1>Block <span>Bloom</span></h1>
    <p>Drag pieces onto the garden. Fill a row or column to make it bloom. The game ends when no piece fits.</p>
    <button class="btn go" id="btnPlay">Play</button>
    <button class="btn" id="btnContinue" hidden>Continue</button>
    <button class="btn" id="btnDaily">Daily garden</button>
    <p class="small" id="dailyNote"></p>
  </div>
</div>
<div class="overlay" id="oOver" hidden>
  <div class="box">
    <h1 style="font-size:1.9rem">No more room!</h1>
    <div class="res" id="oScore">0</div>
    <p id="oDetail"></p>
    <button class="btn go" id="btnAgain">Play again</button>
    <button class="btn" id="btnShare" hidden>Copy result</button>
    <button class="btn" id="btnHome">Menu</button>
  </div>
</div>
<script>
// Block Bloom のルール（画面に依存しない）。8×8 の盤に3つずつ配られる形を置き、横か縦の列がそろうと消える。
(function () {
  'use strict';
  const N = 8;
  // 形は [行, 列] の並び。重いほど出やすい
  const SHAPES = [
    { id: 'o1', cells: [[0, 0]], w: 2 },
    { id: 'i2h', cells: [[0, 0], [0, 1]], w: 3 },
    { id: 'i2v', cells: [[0, 0], [1, 0]], w: 3 },
    { id: 'i3h', cells: [[0, 0], [0, 1], [0, 2]], w: 3 },
    { id: 'i3v', cells: [[0, 0], [1, 0], [2, 0]], w: 3 },
    { id: 'i4h', cells: [[0, 0], [0, 1], [0, 2], [0, 3]], w: 2 },
    { id: 'i4v', cells: [[0, 0], [1, 0], [2, 0], [3, 0]], w: 2 },
    { id: 'i5h', cells: [[0, 0], [0, 1], [0, 2], [0, 3], [0, 4]], w: 1 },
    { id: 'i5v', cells: [[0, 0], [1, 0], [2, 0], [3, 0], [4, 0]], w: 1 },
    { id: 'o2', cells: [[0, 0], [0, 1], [1, 0], [1, 1]], w: 3 },
    { id: 'o3', cells: [[0, 0], [0, 1], [0, 2], [1, 0], [1, 1], [1, 2], [2, 0], [2, 1], [2, 2]], w: 1 },
    { id: 'v1', cells: [[0, 0], [1, 0], [1, 1]], w: 2 },
    { id: 'v2', cells: [[0, 1], [1, 0], [1, 1]], w: 2 },
    { id: 'v3', cells: [[0, 0], [0, 1], [1, 0]], w: 2 },
    { id: 'v4', cells: [[0, 0], [0, 1], [1, 1]], w: 2 },
    { id: 'l1', cells: [[0, 0], [1, 0], [2, 0], [2, 1]], w: 1 },
    { id: 'l2', cells: [[0, 1], [1, 1], [2, 1], [2, 0]], w: 1 },
    { id: 'l3', cells: [[0, 0], [0, 1], [0, 2], [1, 0]], w: 1 },
    { id: 'l4', cells: [[0, 0], [0, 1], [0, 2], [1, 2]], w: 1 },
    { id: 't1', cells: [[0, 0], [0, 1], [0, 2], [1, 1]], w: 1 },
    { id: 't2', cells: [[0, 1], [1, 0], [1, 1], [1, 2]], w: 1 },
    { id: 's1', cells: [[0, 1], [0, 2], [1, 0], [1, 1]], w: 1 },
    { id: 'z1', cells: [[0, 0], [0, 1], [1, 1], [1, 2]], w: 1 },
    { id: 'big', cells: [[0, 0], [0, 1], [0, 2], [1, 0], [2, 0]], w: 1 },
  ];
  const COLORS = 7;
  const BYID = Object.fromEntries(SHAPES.map((s) => [s.id, s]));

  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6d2b79f5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  // 乱数の状態を g に持たせて、保存・再開しても同じ並びになるようにする
  function rand(g) { const r = mulberry32(g.rng)(); g.rng = (Math.floor(r * 4294967296) ^ 0x2545f491) | 0 || 7; return r; }
  function pickShape(g) {
    const total = SHAPES.reduce((a, s) => a + s.w, 0);
    let x = rand(g) * total;
    for (const s of SHAPES) { x -= s.w; if (x < 0) return s.id; }
    return SHAPES[0].id;
  }

  function newGame(opts) {
    const seed = (opts && opts.seed) || 1;
    const g = { seed, rng: seed, board: Array(N * N).fill(0), tray: [], score: 0, streak: 0, lines: 0, placed: 0, over: false, best: 0, lastClear: 0 };
    deal(g);
    return g;
  }
  // 3つ配る。どれも単独なら置けるように選び直す（理不尽な終わりを減らす）
  function deal(g) {
    for (let tries = 0; tries < 20; tries++) {
      const t = [0, 1, 2].map(() => ({ shape: pickShape(g), color: 1 + Math.floor(rand(g) * COLORS) }));
      g.tray = t;
      if (t.every((p) => anyFit(g, p.shape)) || tries === 19) break;
    }
  }
  const cellsOf = (id) => BYID[id].cells;
  function canPlace(g, id, r, c) {
    for (const [dr, dc] of cellsOf(id)) {
      const rr = r + dr, cc = c + dc;
      if (rr < 0 || cc < 0 || rr >= N || cc >= N || g.board[rr * N + cc]) return false;
    }
    return true;
  }
  function anyFit(g, id) {
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) if (canPlace(g, id, r, c)) return true;
    return false;
  }
  // 置いたら消える列（予告表示に使う）
  function wouldClear(g, id, r, c) {
    if (!canPlace(g, id, r, c)) return { rows: [], cols: [] };
    const b = g.board.slice();
    for (const [dr, dc] of cellsOf(id)) b[(r + dr) * N + c + dc] = 1;
    return fullLines(b);
  }
  function fullLines(b) {
    const rows = [], cols = [];
    for (let i = 0; i < N; i++) {
      let rf = true, cf = true;
      for (let j = 0; j < N; j++) { if (!b[i * N + j]) rf = false; if (!b[j * N + i]) cf = false; }
      if (rf) rows.push(i); if (cf) cols.push(i);
    }
    return { rows, cols };
  }
  // 点: 置いたマス数 + 消した列 (1列10, 2列30, 3列60, 4列100…) × 連続で消した回数の倍率
  const lineScore = (n) => (n * (n + 1) / 2) * 10;
  function place(g, slot, r, c) {
    const p = g.tray[slot];
    if (g.over || !p || !canPlace(g, p.shape, r, c)) return null;
    const cells = cellsOf(p.shape);
    for (const [dr, dc] of cells) g.board[(r + dr) * N + c + dc] = p.color;
    g.tray[slot] = null;
    g.placed++;
    let pts = cells.length;
    const { rows, cols } = fullLines(g.board);
    const n = rows.length + cols.length;
    const cleared = [];
    if (n) {
      for (const i of rows) for (let j = 0; j < N; j++) cleared.push(i * N + j);
      for (const i of cols) for (let j = 0; j < N; j++) cleared.push(j * N + i);
      for (const k of cleared) g.board[k] = 0;
      g.streak++;
      g.lines += n;
      pts += lineScore(n) * g.streak;
    } else g.streak = 0;
    const empty = g.board.every((v) => !v);
    if (empty && n) pts += 300; // 盤を空にしたボーナス
    g.score += pts;
    g.lastClear = n;
    if (g.tray.every((x) => !x)) deal(g);
    if (!g.tray.some((x) => x && anyFit(g, x.shape))) { g.over = true; g.best = Math.max(g.best, g.score); }
    return { pts, rows, cols, cleared: [...new Set(cleared)], streak: g.streak, perfect: empty && n > 0, over: g.over };
  }
  function serialize(g) { return JSON.stringify(g); }
  function load(s) {
    try { const g = JSON.parse(s); return g && Array.isArray(g.board) && g.board.length === N * N && Array.isArray(g.tray) ? g : null; } catch (e) { return null; }
  }
  function dailySeed(date) {
    let h = 2166136261;
    for (const ch of 'bloom-' + date) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); }
    return (h >>> 0) || 1;
  }
  const api = { N, SHAPES, BYID, COLORS, newGame, canPlace, anyFit, wouldClear, place, cellsOf, lineScore, serialize, load, dailySeed, mulberry32 };
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  globalThis.BlockBloom = api;
})();
</script>
<script>
(function () {
  'use strict';
  const G = window.BlockBloom;
  const N = G.N;
  const $ = (id) => document.getElementById(id);
  const qs = new URLSearchParams(location.search);
  const TEST = qs.has('test');
  const TODAY = qs.get('date') || new Date().toISOString().slice(0, 10);
  const KEY = 'bb-save', META = 'bb-meta';
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* 保存できなくても遊べる */ } },
    del(k) { try { localStorage.removeItem(k); } catch (e) { /* 同上 */ } },
  };
  let meta = { best: 0, daily: {}, sound: true };
  try { meta = Object.assign(meta, JSON.parse(store.get(META)) || {}); } catch (e) { /* 既定のまま */ }
  const saveMeta = () => store.set(META, JSON.stringify(meta));
  let g = null, mode = 'free';
  const saveGame = () => { if (g && !g.over) store.set(KEY, JSON.stringify({ game: g, mode, date: TODAY })); };

  // ---- 効果音 ----
  let ac = null;
  function tone(f, d, type, v, w) {
    if (!meta.sound || TEST) return;
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      if (ac.state === 'suspended') ac.resume();
      const t = ac.currentTime + (w || 0), o = ac.createOscillator(), gn = ac.createGain();
      o.type = type || 'sine'; o.frequency.setValueAtTime(f, t);
      gn.gain.setValueAtTime(v || 0.07, t); gn.gain.exponentialRampToValueAtTime(0.001, t + d);
      o.connect(gn); gn.connect(ac.destination); o.start(t); o.stop(t + d);
    } catch (e) { /* 音が出せなくても遊べる */ }
  }
  const sfx = {
    pick: () => tone(520, 0.05, 'triangle', 0.05),
    place: () => tone(260, 0.08, 'sine', 0.09),
    bad: () => tone(140, 0.12, 'square', 0.03),
    clear: (n, s) => [0, 4, 7, 12, 16].slice(0, 2 + n).forEach((k, i) => tone(440 * Math.pow(2, (k + s * 2) / 12), 0.18, 'triangle', 0.07, i * 0.06)),
    over: () => [392, 330, 262].forEach((f, i) => tone(f, 0.3, 'sawtooth', 0.035, i * 0.15)),
  };

  // ---- 盤とトレイ ----
  const board = $('board');
  board.innerHTML = Array.from({ length: N * N }, (_, k) => `<div class="cell" data-k="${k}" role="gridcell"></div>`).join('');
  const cells = [...board.children];
  function layout() {
    const narrow = window.matchMedia('(max-width: 760px), (max-aspect-ratio: 4/5)').matches;
    const W = window.innerWidth, H = window.innerHeight;
    // 盤 = 8マス + 隙間、トレイ = 横長なら右に 3.2 マス幅、縦長なら下に 2.4 マス高
    const cs = narrow ? Math.min((W - 40) / 8.6, (H - 90) / 11.4) : Math.min((H - 40) / 8.6, (W - 420) / 11.6);
    $('app').style.setProperty('--cs', `${Math.max(20, Math.floor(cs))}px`);
  }
  const pieceHtml = (p, cls) => {
    const c = G.cellsOf(p.shape);
    const R = Math.max(...c.map((x) => x[0])) + 1, C = Math.max(...c.map((x) => x[1])) + 1;
    const set = new Set(c.map(([r, cc]) => r * 10 + cc));
    let h = '';
    for (let r = 0; r < R; r++) for (let cc = 0; cc < C; cc++) h += `<i class="${set.has(r * 10 + cc) ? 'c' + p.color : 'e'}"></i>`;
    return `<div class="piece ${cls || ''}" style="grid-template-columns:repeat(${C},auto)">${h}</div>`;
  };
  let sel = -1, cursor = { r: 3, c: 3 };
  function renderBoard() {
    g.board.forEach((v, k) => { cells[k].className = 'cell' + (v ? ` f c${v}` : ''); });
  }
  function renderTray() {
    $('tray').innerHTML = g.tray.map((p, i) => `<button class="slot${p && !G.anyFit(g, p.shape) ? ' dead' : ''}" data-s="${i}" aria-pressed="${sel === i}" aria-label="Piece ${i + 1}" ${p ? '' : 'disabled'}>${p ? pieceHtml(p) : ''}</button>`).join('');
  }
  function hud() {
    const best = mode === 'daily' ? Math.max(g.score, meta.daily[TODAY] || 0) : Math.max(meta.best, g.score);
    $('score').textContent = g.score; $('hScore').textContent = g.score;
    $('best').textContent = best; $('hBest').textContent = best;
    $('combo').textContent = g.streak > 1 ? `×${g.streak}` : g.streak === 1 ? '×1' : '–';
    $('mode').textContent = mode === 'daily' ? `Daily garden ${TODAY}` : '';
  }
  function clearPreview() { for (const c of cells) c.classList.remove('pv', 'clr'); }
  function preview(slot, r, c) {
    clearPreview();
    const p = g.tray[slot];
    if (!p || !G.canPlace(g, p.shape, r, c)) return false;
    for (const [dr, dc] of G.cellsOf(p.shape)) cells[(r + dr) * N + c + dc].classList.add('pv');
    const w = G.wouldClear(g, p.shape, r, c);
    for (const i of w.rows) for (let j = 0; j < N; j++) cells[i * N + j].classList.add('clr');
    for (const i of w.cols) for (let j = 0; j < N; j++) cells[j * N + i].classList.add('clr');
    return true;
  }

  function effects(res) {
    const br = board.getBoundingClientRect();
    const colors = ['--c1', '--c2', '--c3', '--c4', '--c5', '--c6', '--c7'];
    for (const k of res.cleared) {
      const el = cells[k];
      el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop');
      if (Math.random() < 0.6) {
        const pr = el.getBoundingClientRect();
        const p = document.createElement('div');
        p.className = 'petal';
        p.style.left = `${pr.left - br.left + pr.width / 2}px`; p.style.top = `${pr.top - br.top + pr.height / 2}px`;
        p.style.background = `var(${colors[k % 7]})`;
        p.style.setProperty('--dx', `${(Math.random() - 0.5) * 120}px`); p.style.setProperty('--dy', `${-30 - Math.random() * 80}px`);
        board.appendChild(p); setTimeout(() => p.remove(), 900);
      }
    }
    if (res.pts > 0) {
      const f = document.createElement('div');
      f.className = 'float';
      f.textContent = res.perfect ? `Perfect! +${res.pts}` : `+${res.pts}${res.streak > 1 ? `  Combo ×${res.streak}` : ''}`;
      f.style.left = '50%'; f.style.top = '45%';
      if (res.cleared.length) { board.appendChild(f); setTimeout(() => f.remove(), 1000); }
    }
  }
  function doPlace(slot, r, c) {
    const res = G.place(g, slot, r, c);
    if (!res) { sfx.bad(); return false; }
    sel = -1;
    clearPreview(); renderBoard(); effects(res); renderTray(); hud();
    if (res.cleared.length) sfx.clear(res.rows.length + res.cols.length, res.streak); else sfx.place();
    saveGame();
    if (res.over) gameOver();
    return true;
  }

  // ---- ドラッグ ----
  let drag = null;
  const cellAt = (x, y) => {
    const br = board.getBoundingClientRect();
    const step = (br.width - 12) / N;
    return { r: Math.round((y - br.top - 6) / step), c: Math.round((x - br.left - 6) / step) };
  };
  $('tray').addEventListener('pointerdown', (e) => {
    const b = e.target.closest('.slot'); if (!b || b.disabled || !g || g.over) return;
    const slot = +b.dataset.s;
    const ghost = document.createElement('div');
    ghost.className = 'ghost'; ghost.innerHTML = pieceHtml(g.tray[slot]);
    $('app').appendChild(ghost);
    const lift = e.pointerType === 'mouse' ? 0 : 1; // 指で隠れないよう少し上に出す
    drag = { slot, ghost, lift, id: e.pointerId, moved: false, sx: e.clientX, sy: e.clientY };
    b.setPointerCapture(e.pointerId);
    sfx.pick(); moveGhost(e);
  });
  function moveGhost(e) {
    if (!drag) return;
    const gr = drag.ghost.getBoundingClientRect();
    const x = e.clientX - gr.width / 2, y = e.clientY - gr.height / 2 - drag.lift * (gr.height / 2 + 30);
    drag.ghost.style.left = `${x}px`; drag.ghost.style.top = `${y}px`;
    if (Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) > 8) drag.moved = true;
    const cs = (board.getBoundingClientRect().width - 12) / N;
    const t = cellAt(x + cs / 2, y + cs / 2);
    drag.r = t.r; drag.c = t.c;
    drag.ok = preview(drag.slot, t.r, t.c);
  }
  $('tray').addEventListener('pointermove', moveGhost);
  $('tray').addEventListener('pointerup', (e) => {
    if (!drag) return;
    moveGhost(e);
    const d = drag; drag = null; d.ghost.remove();
    if (d.moved && d.ok) doPlace(d.slot, d.r, d.c);
    else { clearPreview(); if (!d.moved) { sel = sel === d.slot ? -1 : d.slot; renderTray(); if (sel >= 0) preview(sel, cursor.r, cursor.c); } }
  });
  $('tray').addEventListener('pointercancel', () => { if (drag) { drag.ghost.remove(); drag = null; clearPreview(); } });
  // 選んでから盤をタップして置く
  board.addEventListener('pointermove', (e) => {
    if (sel < 0 || drag) return;
    const t = cellAt(e.clientX - ((board.getBoundingClientRect().width - 12) / N) / 2, e.clientY - ((board.getBoundingClientRect().width - 12) / N) / 2);
    cursor = { r: Math.max(0, t.r), c: Math.max(0, t.c) }; preview(sel, cursor.r, cursor.c);
  });
  board.addEventListener('click', (e) => {
    if (sel < 0) return;
    const cell = e.target.closest('.cell'); if (!cell) return;
    const k = +cell.dataset.k;
    doPlace(sel, Math.floor(k / N), k % N);
  });
  document.addEventListener('keydown', (e) => {
    if (!g || g.over || !$('oTitle').hidden) return;
    if (['1', '2', '3'].includes(e.key)) { const s = +e.key - 1; if (g.tray[s]) { sel = s; renderTray(); preview(sel, cursor.r, cursor.c); } return; }
    if (sel < 0) return;
    const mv = { ArrowUp: [-1, 0], ArrowDown: [1, 0], ArrowLeft: [0, -1], ArrowRight: [0, 1] }[e.key];
    if (mv) { e.preventDefault(); cursor = { r: Math.min(N - 1, Math.max(0, cursor.r + mv[0])), c: Math.min(N - 1, Math.max(0, cursor.c + mv[1])) }; preview(sel, cursor.r, cursor.c); }
    else if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); doPlace(sel, cursor.r, cursor.c); }
    else if (e.key === 'Escape') { sel = -1; clearPreview(); renderTray(); }
  });

  // ---- 画面の流れ ----
  function start(m, game) {
    mode = m;
    g = game || G.newGame({ seed: m === 'daily' ? G.dailySeed(TODAY) : (qs.has('seed') ? +qs.get('seed') : Math.floor(Math.random() * 2 ** 31) + 1) });
    sel = -1;
    $('oTitle').hidden = true; $('oOver').hidden = true;
    renderBoard(); renderTray(); hud(); saveGame();
  }
  function gameOver() {
    sfx.over(); store.del(KEY);
    let note;
    if (mode === 'daily') {
      if (meta.daily[TODAY] == null) { meta.daily[TODAY] = g.score; note = 'Your daily score is saved. A new garden grows tomorrow!'; }
      else note = `Practice run. Your daily score: ${meta.daily[TODAY]}.`;
    } else { note = g.score > meta.best ? 'New best!' : `Best: ${meta.best}`; meta.best = Math.max(meta.best, g.score); }
    saveMeta();
    $('oScore').textContent = g.score;
    $('oDetail').textContent = `${g.lines} lines bloomed · ${g.placed} pieces. ${note}`;
    $('btnShare').hidden = mode !== 'daily'; $('btnShare').textContent = 'Copy result';
    setTimeout(() => { $('oOver').hidden = false; $('btnAgain').focus(); }, TEST ? 0 : 900);
  }
  function showTitle() {
    let saved = null;
    try { const s = JSON.parse(store.get(KEY)); if (s && !(s.mode === 'daily' && s.date !== TODAY)) { const gg = G.load(JSON.stringify(s.game)); if (gg && !gg.over) saved = { game: gg, mode: s.mode }; } } catch (e) { saved = null; }
    $('btnContinue').hidden = !saved;
    $('btnContinue').onclick = () => { if (saved) start(saved.mode, saved.game); };
    const ds = meta.daily[TODAY];
    $('dailyNote').textContent = ds != null ? `Today's daily score: ${ds}. You can still practice it.` : 'Everyone gets the same pieces today. Only your first try counts.';
    $('oOver').hidden = true; $('oTitle').hidden = false; $('btnPlay').focus();
  }
  $('btnPlay').addEventListener('click', () => start('free'));
  $('btnDaily').addEventListener('click', () => start('daily'));
  $('btnAgain').addEventListener('click', () => start(mode));
  $('btnHome').addEventListener('click', showTitle);
  $('btnShare').addEventListener('click', () => {
    const url = globalThis.BB_SHARE_URL || location.origin + location.pathname;
    const text = `Block Bloom daily ${TODAY}: ${meta.daily[TODAY] ?? g.score} pts, ${g.lines} lines 🌸\n${url}`;
    let done = false;
    const fin = (ok) => { if (!done) { done = true; $('btnShare').textContent = ok ? 'Copied!' : text; } };
    setTimeout(() => fin(false), 1500); // 許可がない環境では文面を見せる
    try { navigator.clipboard.writeText(text).then(() => fin(true), () => fin(false)); } catch (e) { fin(false); }
  });
  function renderSound() { for (const b of [$('btnSound'), $('hSound')]) { b.textContent = meta.sound ? '🔊' : '🔇'; b.setAttribute('aria-label', meta.sound ? 'Sound on' : 'Sound off'); } }
  for (const b of [$('btnSound'), $('hSound')]) b.addEventListener('click', () => { meta.sound = !meta.sound; saveMeta(); renderSound(); });
  window.addEventListener('resize', layout);
  window.addEventListener('pagehide', saveGame);
  document.addEventListener('visibilitychange', () => { if (document.hidden) saveGame(); });
  if (TEST) window.__bb = { get game() { return g; }, G, place: doPlace, start, render() { renderBoard(); renderTray(); hud(); } }; // 検証用
  layout(); renderSound(); showTitle();
})();
</script>
</body>
</html>
