<title>電池ひとつ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+1+Code:wght@500;700&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap">
<style>
/* Layout: 試験場の管制卓。上に観測窓（キャンバス）、下に記録板と操作卓 */
:root {
  --bg: #111417;
  --panel: #1a1f24;
  --panel-2: #222930;
  --line: #2f3840;
  --fg: #e9edf0;
  --muted: #8d99a3;
  --volt: #3ee6ff;
  --amber: #ffb000;
  --hot: #ff5a36;
  --rival: #ff6b8a;
  --f-display: "Dela Gothic One", "Hiragino Sans", "Noto Sans JP", sans-serif;
  --f-body: "Zen Kaku Gothic New", "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
  --f-num: "M PLUS 1 Code", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { background: var(--bg); color: var(--fg); }
body {
  font-family: var(--f-body);
  font-size: 14px;
  line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 14px 32px;
}
.wrap { max-width: 1120px; margin: 0 auto; display: grid; gap: 12px; }
header { display: flex; align-items: center; justify-content: space-between; gap: 8px 16px; flex-wrap: wrap; }
.brand { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; min-width: 0; }
h1 { font-family: var(--f-display); font-weight: 400; font-size: clamp(22px, 4vw, 30px); margin: 0; letter-spacing: .03em; line-height: 1.2; }
h1 .bolt { color: var(--volt); }
.tag { color: var(--muted); font-size: 13px; }
.tools { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.chip-btn {
  font: inherit; font-size: 12px; color: var(--muted); background: transparent;
  border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; cursor: pointer; text-decoration: none;
}
.chip-btn:hover { color: var(--fg); border-color: var(--muted); }
.sel { display: flex; gap: 6px; align-items: center; font-size: 12px; color: var(--muted); }
.sel select { font: inherit; font-size: 12px; color: var(--fg); background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 3px 8px; }
.sel select:disabled { opacity: .45; }
.allbest { font-family: var(--f-num); font-size: 12px; color: var(--muted); }
.allbest b { color: var(--fg); font-weight: 700; }

.board { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)) repeat(2, minmax(0, .9fr)); gap: 8px; }
.cell { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; min-width: 0; }
.cell .k { font-size: 11px; color: var(--muted); letter-spacing: .06em; display: flex; justify-content: space-between; gap: 6px; }
.cell .v { font-family: var(--f-num); font-weight: 700; font-size: 18px; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cell .v small { font-size: 12px; color: var(--muted); font-weight: 500; margin-left: 2px; }
.cell.now { border-style: dashed; border-color: var(--muted); }
.cell.top { border-color: var(--amber); }
.cell.top .v { color: var(--amber); }
.cell.rival .v { color: var(--rival); }
.cell.empty .v { color: var(--line); }

.stage { position: relative; border-radius: 8px; overflow: hidden; border: 1px solid var(--line); background: #cfe8f2; aspect-ratio: 16 / 9; max-width: 100%; }
.stage canvas { display: block; width: 100%; height: 100%; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; cursor: pointer; }
.endcard {
  position: absolute; inset: 0; display: grid; place-items: center; padding: 12px;
  background: rgba(10, 13, 16, .55);
}
.endcard .card {
  background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
  padding: 16px 20px; width: min(440px, 100%); display: grid; gap: 10px; max-height: 100%; overflow: auto;
}
.endcard h2 { font-family: var(--f-display); font-weight: 400; margin: 0; font-size: 22px; }
.endcard .big { font-family: var(--f-num); font-size: 34px; font-weight: 700; color: var(--amber); line-height: 1.1; }
.endcard p { margin: 0; color: var(--muted); }
.endcard .unlock { color: var(--volt); }
.pick { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.pick > span { font-size: 12px; color: var(--muted); margin-right: 4px; min-width: 6em; }
.pick .chip-btn[aria-pressed="true"] { color: #062026; background: var(--volt); border-color: var(--volt); }
.cnote { font-size: 12px; min-height: 1em; }

.hint { margin: 0; min-height: 1.6em; color: var(--fg); font-size: 14px; }
.hint .lead { color: var(--volt); font-weight: 700; margin-right: 6px; }

.result { display: grid; grid-template-columns: auto 1fr; gap: 6px 18px; align-items: start; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; }
.result .rec { font-family: var(--f-num); font-weight: 700; font-size: 30px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.result .rec.new { color: var(--amber); }
.result .rec small { font-size: 13px; color: var(--muted); display: block; font-weight: 500; font-family: var(--f-body); }
.cmp { grid-column: 1 / -1; display: grid; grid-template-columns: auto 1fr auto; gap: 4px 10px; align-items: center; font-size: 12px; }
.cmp .lbl { color: var(--muted); white-space: nowrap; }
.cmp .bar { position: relative; height: 12px; background: #1d2328; border-radius: 3px; overflow: hidden; }
.cmp .bar i { position: absolute; top: 0; bottom: 0; transform-origin: left; animation: grow .6s cubic-bezier(.2,.8,.2,1) both; }
.cmp .bar i.air { background: var(--volt); }
.cmp .bar i.aft { background: #a0603a; }
.cmp .bar i.riv { background: var(--rival); }
.cmp .bar i.ghost { opacity: .45; }
.cmp .num { font-family: var(--f-num); font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
@keyframes grow { from { transform: scaleX(0); } }
@media (prefers-reduced-motion: reduce) { .cmp .bar i { animation: none; } }
.stats { display: flex; flex-wrap: wrap; gap: 4px 18px; font-size: 13px; min-width: 0; }
.stats span { white-space: nowrap; }
.stats b { font-family: var(--f-num); font-variant-numeric: tabular-nums; }
.sw { display: inline-block; width: 10px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 4px; }
.notes { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px; }
.note.tip { color: var(--fg); border-color: var(--volt); white-space: normal; border-radius: 8px; }
.note .tipi { font-style: normal; color: var(--volt); font-weight: 700; margin-right: 6px; }
.note { font-size: 12px; border: 1px solid var(--line); border-radius: 999px; padding: 1px 10px; color: var(--muted); }

.deck { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1.2fr) minmax(0, .8fr) minmax(180px, .9fr); gap: 10px; align-items: stretch; }
.pane { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; display: grid; gap: 8px; align-content: start; min-width: 0; }
.pane h3 { margin: 0; font-size: 12px; color: var(--muted); font-weight: 700; letter-spacing: .08em; display: flex; justify-content: space-between; gap: 8px; }
.pane h3 output { font-family: var(--f-num); color: var(--fg); letter-spacing: 0; }
.types { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.type {
  font: inherit; color: var(--fg); text-align: left; cursor: pointer; background: var(--panel-2);
  border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; display: grid; gap: 2px; min-width: 0;
}
.type svg { width: 28px; height: 20px; }
.type b { font-size: 13px; }
.type span { font-size: 11px; color: var(--muted); line-height: 1.35; }
.type[aria-pressed="true"] { border-color: var(--volt); box-shadow: inset 0 0 0 1px var(--volt); }
.type:disabled { cursor: not-allowed; opacity: .38; }
.battery { display: grid; grid-template-columns: repeat(10, 1fr); gap: 3px; height: 22px; }
.battery i { border-radius: 2px; background: var(--line); }
.battery i.r { background: var(--volt); }
.battery i.s { background: var(--amber); }
.legend { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); gap: 8px; flex-wrap: wrap; }
.legend b { font-family: var(--f-num); color: var(--fg); }
input[type="range"] { width: 100%; accent-color: var(--volt); margin: 0; }
input[type="range"]:disabled { opacity: .4; }
.fire {
  font: inherit; cursor: pointer; border: 0; border-radius: 8px; padding: 10px 14px;
  background: var(--volt); color: #062026; display: grid; place-content: center; gap: 2px; text-align: center;
  user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; touch-action: none; min-height: 84px;
}
.fire b { font-family: var(--f-display); font-weight: 400; font-size: 20px; letter-spacing: .04em; }
.fire span { font-size: 12px; opacity: .8; }
.fire.charging { background: var(--amber); color: #2a1c00; }
.fire.over { background: var(--hot); color: #2b0700; }
.fire.next { background: var(--fg); color: var(--bg); }
.fire:disabled { opacity: .45; cursor: default; }
.side { display: grid; gap: 6px; }
.subbtns { display: flex; gap: 6px; }
.heat { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
.heat b { font-family: var(--f-num); color: var(--fg); font-size: 12px; }
.hbar { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; }
.hbar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--amber), var(--hot)); transition: width .4s; }
.subbtns button { flex: 1; font: inherit; font-size: 12px; color: var(--fg); background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 6px; cursor: pointer; }
.subbtns button:disabled { opacity: .35; cursor: default; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--volt); outline-offset: 2px; }
.keys { font-size: 11px; color: var(--muted); }
kbd { font-family: var(--f-num); font-size: 11px; border: 1px solid var(--line); border-radius: 3px; padding: 0 4px; }

@media (max-width: 820px) {
  .deck { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .deck .pane.typesPane { grid-column: 1 / -1; }
  .deck .side { grid-column: 1 / -1; }
  .board { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .board .cell.wide { grid-column: span 1; }
}
@media (max-width: 560px) {
  body { padding-bottom: calc(150px + env(safe-area-inset-bottom, 0px)); }
  .side {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; gap: 6px;
    background: var(--bg); border-top: 1px solid var(--line);
    padding: 8px max(16px, env(safe-area-inset-right, 0px)) calc(8px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  }
  .fire { min-height: 58px; padding: 6px 12px; }
  .fire b { font-size: 18px; }
  .stage { aspect-ratio: 4 / 3; }
  .deck { grid-template-columns: minmax(0, 1fr); }
  .board { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .cell .v { font-size: 15px; }
  .result { grid-template-columns: 1fr; }
  .keys { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto; } }
</style>

<div class="wrap">
  <header>
    <div class="brand">
      <h1>電池<span class="bolt">ひとつ</span></h1>
      <span class="tag">電力100を、撃つ瞬間と飛んでいる間に配るレールガン飛距離試験 ・ 試作版</span>
    </div>
    <div class="tools">
      <span class="allbest" id="allbest"></span>
      <button class="chip-btn" id="skipTut" type="button">練習を飛ばして全部使う</button>
      <label class="sel" id="selWrap"><span>コース</span><select id="selCourse"></select><span>相手</span><select id="selLevel"></select></label>
      <button class="chip-btn" id="sound" type="button" aria-pressed="true">音：入</button>
      <button class="chip-btn" id="music" type="button" aria-pressed="true">曲：入</button>
    </div>
  </header>

  <div class="board" id="board" aria-live="polite"></div>

  <div class="stage" id="stage">
    <canvas id="cv" aria-label="試験場。横から見たコース。長押しで充電、離して発射、飛行中はタップで電力を使う"></canvas>
    <div class="endcard" id="endcard" hidden>
      <div class="card" id="endbody"></div>
    </div>
    <div class="endcard" id="share" hidden>
      <div class="card">
        <img id="shareImg" alt="この勝負の記録カード" style="width:100%;border-radius:6px">
        <div class="pick"><button type="button" class="chip-btn" id="shareDl" hidden>画像を保存</button><button type="button" class="chip-btn" id="shareClose">閉じる</button></div>
        <p class="cnote" id="shareMsg">保存できないときは、画像を長押し（右クリック）して保存してください。</p>
      </div>
    </div>
  </div>

  <p class="hint" id="hint"></p>
  <div class="result" id="result" hidden></div>

  <div class="deck">
    <div class="pane typesPane">
      <h3>弾 <span id="typeNote"></span></h3>
      <div class="types" id="types"></div>
    </div>
    <div class="pane">
      <h3>電力100の配分 <output id="allocOut"></output></h3>
      <div class="battery" id="battery" aria-hidden="true"></div>
      <input type="range" id="alloc" min="20" max="100" step="10" value="100" aria-label="レールに回す電力">
      <div class="legend"><span>レール（発射） <b id="railV">100</b></span><span>弾内（飛行中に使う） <b id="storeV">0</b></span></div>
    </div>
    <div class="pane">
      <h3>発射角 <output id="angleOut">30°</output></h3>
      <input type="range" id="angle" min="10" max="60" step="5" value="30" aria-label="発射角">
      <div class="legend"><span>低い</span><span>高い</span></div>
    </div>
    <div class="side">
      <button class="fire" id="fire" type="button"><b id="fireMain">長押しで充電</b><span id="fireSub">離すと発射</span></button>
      <div class="heat" title="配分を超えて溜めるほど熱くなり、次の発射で欲張れる幅が狭くなります。1発ごとに少し冷えます。">
        <span>レール温度</span><div class="hbar"><i id="heatFill"></i></div><b id="heatV">+30%</b>
      </div>
      <div class="subbtns">
        <button type="button" id="ffBtn" disabled>早送り</button>
        <button type="button" id="skipBtn" disabled>結果まで飛ばす</button>
      </div>
      <div class="keys"><kbd>Space</kbd> 長押しで充電／飛行中に電力を使う　<kbd>F</kbd> 早送り</div>
    </div>
  </div>
</div>

<script>
/* SIM-BEGIN */
const G = 9.8;
const WIND = 2; // 追い風 m/s
// コース。surf は地面の性質（dec＝転がり抵抗、drag＝速さに比例する地面の抵抗、e＝跳ね返り、keep＝着地で残る速さ、skip＝水切りに要る速さ）への倍率
// 坂を下りきった高さ（-slopeDrop）が池の水面になる
const COURSES = {
  field: { name: '平原', pond: '池',
    slopeA: 260, slopeB: 400, slopeDrop: 20, pondA: 400, pondB: 450, water: -20, pondBed: -24,
    hillA: 600, hillRise: 0.08, end: 800, surf: { dec: 1, drag: 1, e: 1, keep: 1, skip: 1 } },
  ice: { name: '氷原', pond: '氷の割れ目',
    slopeA: 180, slopeB: 320, slopeDrop: 14, pondA: 490, pondB: 525, water: -14, pondBed: -18,
    hillA: 640, hillRise: 0.06, end: 800, surf: { dec: 0.2, drag: 0.25, e: 0.6, keep: 1.05, skip: 0.75 } },
  desert: { name: '砂漠', pond: 'オアシス',
    slopeA: 300, slopeB: 420, slopeDrop: 10, pondA: 470, pondB: 510, water: -10, pondBed: -13,
    hillA: 620, hillRise: 0.05, end: 800, surf: { dec: 2.2, drag: 1.6, e: 0.7, keep: 0.85, skip: 1 },
    thermals: [{ x0: 240, x1: 300, lift: 7 }, { x0: 520, x1: 570, lift: 7 }] },
};
const COURSE = Object.assign({}, COURSES.field);
const TYPES = {
  roll:   { name: '転がり弾', cd: 0.0007, e: 0.30, keep: 0.90, dec: 0.9, drag: 0.003, tap: 'ホップ' },
  bounce: { name: '跳ね弾',   cd: 0.0012, e: 0.68, keep: 0.88, dec: 3.5, drag: 0.03, tap: '次の着地で強く跳ねる' },
  glide:  { name: '滑空弾',   cd: 0.0010, e: 0.15, keep: 0.65, dec: 6.0, drag: 0.03, tap: '翼を開く／あおる' },
};
// 壊せる障害物。hp = 壊すのに必要な速さ（m/s）、keep = 壊したあとに残る速さの割合
const OBSTS = {
  field: [
    { id: 'crate', name: '木箱',   x: 120, h: 1.6, w: 1.4, hp: 12, keep: 0.85 },
    { id: 'fence', name: '柵',     x: 200, h: 2.5, w: 0.5, hp: 28, keep: 0.70 },
    { id: 'scare', name: 'かかし', x: 330, h: 3.2, w: 0.6, hp: 14, keep: 0.85 },
    { id: 'rock',  name: '大岩',   x: 520, h: 2.2, w: 3.0, hp: 42, keep: 0.60 },
    { id: 'barn',  name: '小屋',   x: 680, h: 4.5, w: 6.0, hp: 32, keep: 0.65 },
  ],
  ice: [
    { id: 'snowman', name: '雪だるま', x: 110, h: 2.4, w: 1.3, hp: 10, keep: 0.88 },
    { id: 'icicle',  name: '氷柱',     x: 250, h: 3.0, w: 0.8, hp: 24, keep: 0.75 },
    { id: 'igloo',   name: 'かまくら', x: 400, h: 2.6, w: 4.0, hp: 24, keep: 0.75 },
    { id: 'berg',    name: '氷山',     x: 590, h: 3.4, w: 4.0, hp: 42, keep: 0.60 },
    { id: 'lodge',   name: '山小屋',   x: 720, h: 4.5, w: 6.0, hp: 32, keep: 0.65 },
  ],
  desert: [
    { id: 'cactus',  name: 'サボテン', x: 140, h: 3.0, w: 0.9, hp: 14, keep: 0.85 },
    { id: 'bus',     name: '廃バス',   x: 300, h: 3.2, w: 8.0, hp: 40, keep: 0.60 },
    { id: 'pillar',  name: '石柱',     x: 430, h: 4.2, w: 1.2, hp: 30, keep: 0.70 },
    { id: 'ruin',    name: '遺跡の壁', x: 580, h: 3.0, w: 2.0, hp: 36, keep: 0.65 },
    { id: 'wagon',   name: '幌馬車',   x: 720, h: 3.5, w: 5.0, hp: 28, keep: 0.70 },
  ],
};
const OBST = OBSTS.field.slice();
function useCourse(key) {
  Object.assign(COURSE, { thermals: null }, COURSES[key]); COURSE.key = key;
  OBST.length = 0; OBST.push(...OBSTS[key]);
}
useCourse('field');
// 弾の重さ：壊すのに必要な速さへの倍率（小さいほど壊しやすい）
const HEAVY = { roll: 0.7, bounce: 1.3, glide: 1.0 };
const GLIDE_CL = 0.023, GLIDE_CD = 0.0062;
const TAP_COST = 10;

function groundY(x) {
  const c = COURSE;
  if (x < c.slopeA) return 0;
  if (x < c.slopeB) return -c.slopeDrop * (x - c.slopeA) / (c.slopeB - c.slopeA);
  if (x >= c.pondA && x < c.pondB) return c.pondBed;
  if (x < c.hillA) return -c.slopeDrop;
  return c.water + (x - c.hillA) * c.hillRise;
}
function groundSlope(x) {
  const c = COURSE;
  if (x >= c.slopeA && x < c.slopeB) return -c.slopeDrop / (c.slopeB - c.slopeA);
  if (x >= c.hillA) return c.hillRise;
  return 0;
}
function inPond(x) { return x >= COURSE.pondA && x < COURSE.pondB; }
function surfaceY(x) { return inPond(x) ? COURSE.water : groundY(x); }

function launchSpeed(E) { return 4.5 * Math.sqrt(Math.max(E, 0)); }

function makeShot(type, store, angleDeg, E, wind = WIND) {
  const a = angleDeg * Math.PI / 180, v = launchSpeed(E);
  return {
    type, store, wind, x: 1.5, y: 2.5, vx: v * Math.cos(a), vy: v * Math.sin(a),
    phase: 'air', u: 0, wings: false, armed: 0, landed: false, firstLandX: null,
    maxY: 2.5, t: 0, done: false, sunk: false, path: [], taps: [], events: [], seg: 'air',
    stillT: 0, broken: {},
  };
}

function ev(s, kind, extra) { s.events.push(Object.assign({ kind, x: s.x, y: s.y, t: s.t, v: Math.hypot(s.vx, s.vy) }, extra || {})); }

// 障害物との衝突。px→s.x の間に障害物の正面があれば、壊すか跳ね返される
function obstacles(s, px) {
  for (const o of OBST) {
    if (s.broken[o.id] || !(px < o.x && s.x >= o.x)) continue;

function finishShot() {

  if (s.sunk) notes.push(`${COURSE.pond}に沈みました`);

  if (m.store0 && s.store >= TAP_COST) notes.push(`弾内の電力が${Math.floor(s.store / TAP_COST)}回分残りました`);
  // 次の一発への一言（弾ごとの見せ場）
  let tip = '';
  const blk = s.events.find(e => e.kind === 'block'), left = Math.floor(s.store / TAP_COST);
  if (m.type === 'roll' && s.sunk && left > 0) tip = `${COURSE.pond}の縁や水面すれすれでタップすると水面ホップ。3回あれば越えられます`;
  else if (m.type === 'roll' && s.sunk) tip = `弾内に電力を3回分残すと、${COURSE.pond}を水面ホップで越えられます`;
  else if (blk && m.type !== 'roll') tip = `${blk.name}は鉄球（転がり弾）なら壊しやすい。跳ね弾・滑空弾は上を越える角度で`;
  else if (blk) tip = `${blk.name}を壊すには、低い角度で強く撃つか、手前でタップしてホップ`;
  else if (m.type === 'glide' && COURSE.thermals && m.store0 && !s.wings) tip = '翼を開いたまま上昇気流に入ると、ぐっと持ち上げられます';
  else if (m.type === 'roll' && COURSE.key === 'desert' && !s.sunk) tip = '砂は転がりをすぐ止めます。砂漠では空中で稼ぐ弾が有利です';
  else if (m.type === 'glide' && !s.wings && m.store0) tip = '滑空弾は最高点を過ぎたあたりでタップすると翼が開き、長く滑空します';
  else if (m.type === 'bounce' && left > 0) tip = 'タップしておくと、次の着地で強く跳ねます。着地の直前が効きます';
  else if (!m.store0 && g.shots.length === 0) tip = '配分で弾に電力を残すと、飛んでいる間にタップで使えます';
  if (tip) notes.push('<i class="tipi">ヒント</i>' + tip);
  const rec = { smashed, chain: chainCount(), props: Object.assign({}, g.props), broken: Object.assign({}, s.broken), d, type: m.type, rail: m.rail, E: m.E, ang: m.ang, mis: m.mis, air, after: d - air, maxY: Math.max(0, s.maxY), used, total: m.store0 / TAP_COST, taps: s.taps.slice(), path: m.path, notes };
  const heat0 = g.heat;
  g.heat = m.mis ? 100 : Math.min(100, Math.max(0, g.heat - 30) + Math.max(0, m.E / m.rail - 1) * 250);
  rec.heat = [heat0, g.heat];
  g.shots.push(rec);
  const isTop = !prevTop || d > prevTop.d;
  const isBest = !g.best || d > g.best.d;

    g.best = { d, type: m.type, path: m.path.filter((_, i) => i % step === 0).map(p => [Math.round(p[0] * 10) / 10, Math.round(p[1] * 10) / 10, p[2]]) };

}

/* ---------- 更新 ---------- */
// 地面に残る跡：転がり＝わだち、滑空＝滑った跡（線）、跳ね＝跳ね跡（くぼみ）
function trackMarks(s) {
  if (s.phase === 'ground' && !inPond(s.x)) {
    const m = g.curMark;
    if (m && Math.abs(s.x - m.x1) < 2) m.x1 = Math.max(m.x1, s.x);
    else { g.curMark = { x0: s.x, x1: s.x, kind: s.type }; g.marks.push(g.curMark); }
  } else g.curMark = null;
}
function samplePath(dt) {
  g.pathAcc += dt;
  if (g.pathAcc >= 1 / 30) {
    g.pathAcc = 0;
    const s = g.shot;
    g.meta.path.push([s.x, s.y, s.seg === 'air' ? 0 : s.seg === 'bounce' ? 1 : 2]);
  }
}
// 転がり弾が池の縁や水面すれすれにいる間は、タップで「水面ホップ」できる合図を出す
function hopCheck(s) {
  g.hopNow = !s.done && s.store >= TAP_COST && waterHop(s) && (s.phase === 'ground' || s.vy < 0);
}
function timeScale(s) {
  if (g.ff) return 5;
  let ts = 1.9; g.slow = false;
  const C = COURSE;
  if (s.store >= TAP_COST) {
    const nearObst = OBST.some(o => !s.broken[o.id] && s.x > o.x - 24 && s.x < o.x && s.y < groundY(o.x) + o.h + 10);
    const nearPond = s.x > C.pondA - 24 && s.x < C.pondA + 3 && s.y < C.water + 12;
    if (nearObst || nearPond || g.hopNow) { ts = 0.45; g.slow = true; }
  }
  if (s.phase === 'ground' && Math.abs(s.u) < 7) ts = Math.max(ts, 3);
  if (s.t > 18) ts = Math.max(ts, 3);
  return ts;
}

function update(dt) {
  g.time += dt;
  if (g.state === 'charge') {
    const R = g.rail;
    g.charge += (g.charge < R ? 60 : (0.3 * R) / 1.5) * dt;
    if (g.charge > R) {
      g.overT += dt;
      const k = Math.min(1, (g.charge - R) / (0.3 * R));
      g.sway = 13 * Math.pow(k, 0.8) * Math.sin(g.overT * Math.PI * 2 * 1.7);
      if (Math.random() < 0.5) spark(1 + Math.random(), 2.4, (Math.random() - .5) * 8, Math.random() * 8, '#ffb000');
    } else g.sway = 0;
    sfx.chargeUpdate(Math.min(1, g.charge / 100), g.charge > R ? (g.charge - R) / (0.3 * R) : 0);
    // 10ごとに段階音。配分に達した瞬間は別の音

  if (g.state === 'aim') {
    ctx.textAlign = 'right'; ctx.font = `700 12px ${getVar('--f-body')}`; ctx.fillStyle = T().ink;
    ctx.fillText(`${COURSE.name} ・ ${T().name} ・ ${windText(g.wind)} ${g.wind > 0 ? '→' : g.wind < 0 ? '←' : ''}`, W - 14, 22);
    // 吹き流し
    const wx = W - 30, wy = 34, len = 10 + Math.abs(g.wind) * 5, dir = g.wind >= 0 ? 1 : -1;
    ctx.strokeStyle = T().ink; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(wx, wy); ctx.lineTo(wx, wy + 26); ctx.stroke();
    ctx.fillStyle = '#ff7a45'; ctx.beginPath(); ctx.moveTo(wx, wy); ctx.lineTo(wx + dir * len, wy + 3 + Math.sin(g.time * 6) * 1.5); ctx.lineTo(wx + dir * len, wy + 7 + Math.sin(g.time * 6) * 1.5); ctx.lineTo(wx, wy + 10); ctx.closePath(); ctx.fill();
    if (!g.shots.length && !g.banner) { ctx.textAlign = 'center'; ctx.font = `400 15px ${getVar('--f-display')}`; ctx.fillStyle = T().ink; ctx.globalAlpha = .7; ctx.fillText('長押しで充電 ・ 離して発射', W / 2, H * 0.3); ctx.globalAlpha = 1; }
  }
}

function render() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.save();
  const shk = RM ? g.shake * 0.15 : g.shake;
  if (shk > 0.3) ctx.translate((Math.random() - .5) * shk, (Math.random() - .5) * shk);
  // 発射の瞬間、砲口を中心にぐっと寄る
  if (g.punch > 0 && !RM) { const px = X(1.5), py = Y(2.5), z = 1 + Math.min(1, g.punch) * 0.06 * Math.max(1, g.punch); ctx.translate(px, py); ctx.scale(z, z); ctx.translate(-px, -py); }
  drawSky(); drawTerrain();
  const top = matchTop();
  if (g.unlocked) { drawPath(g.rival.path, { color: '#ff6b8a', dash: [5, 6], w: 1.5, alpha: .7 }); drawFlag(g.rival.d, '#ff6b8a', `相手 ${M(g.rival.d)}m`, g.rivalFall || 0, g.state === 'end' && g.lost ? 1 : 0); }
  if (g.best && (!top || g.best.d > top.d + 0.05)) { drawPath(g.best.path, { color: '#ffffff', dash: [2, 5], w: 1.5, alpha: .8 }); drawFlag(g.best.d, '#ffffff', `自己ベスト ${M(g.best.d)}m`); }
  for (const s of g.shots) {
    const isCur = g.state === 'result' && s === g.shots[g.shots.length - 1];
    if (isCur) continue;
    drawPath(s.path, { color: s === top ? '#ffb000' : '#ffffff', dash: s === top ? [6, 5] : null, w: s === top ? 2 : 1.2, alpha: s === top ? .9 : .35 });
  }
  if (top) drawFlag(top.d, '#ffb000', `今回の最高 ${M(top.d)}m`, g.state === 'fly' && g.passedTop ? g.flagFall : 0);
  // 勝負の終わり：最高の一発の軌道を光がなぞり続ける
  if (g.state === 'end' && top && top.path.length > 2) {
    const n = top.path.length, i = Math.floor((g.time * 45) % (n + 25));
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    for (let k = 0; k < 14; k++) {
      const j = i - k; if (j < 0 || j >= n) continue;
      const pt = top.path[j], a = 1 - k / 14;
      ctx.fillStyle = `rgba(255,190,60,${.85 * a})`; ctx.beginPath(); ctx.arc(X(pt[0]), Y(pt[1]), 2 + 5 * a, 0, 7); ctx.fill();
    }
    ctx.restore();
  }
  if (g.state === 'fly' && g.meta) { drawPath(g.meta.path.concat([[g.shot.x, g.shot.y, g.shot.seg === 'air' ? 0 : g.shot.seg === 'bounce' ? 1 : 2]]), { w: 3 }); drawTapMarks(g.shot.taps); }
  if ((g.state === 'result') && g.shots.length) { const last = g.shots[g.shots.length - 1]; drawPath(last.path, { w: 3 }); drawTapMarks(last.taps); const fx = X(last.d), fy = Y(surfaceY(last.d)); ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(fx, fy - 3, 4, 0, 7); ctx.fill(); }
  drawLabels();
  drawGun();
  if (g.state === 'fly' && g.shot) {
    if (g.unlocked) drawGhost(ghostAt(g.rival.path, g.shot.t, 20), '#ff6b8a', '相手');
    if (top) drawGhost(ghostAt(top.path, g.shot.t, 30), '#ffb000', '今回の最高');
  }
  drawShot();
  for (const p of g.parts) if (p.smoke) {
    ctx.globalAlpha = Math.max(0, Math.min(1, p.life * .8)); ctx.fillStyle = p.c;
    ctx.beginPath(); ctx.arc(X(p.x), Y(p.y), p.r, 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;
  for (const p of g.parts) {
    if (p.smoke) continue;
    ctx.globalAlpha = Math.max(0, Math.min(1, p.life)); ctx.fillStyle = p.c;
    if (p.glow) { ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.fillRect(X(p.x) - p.r, Y(p.y) - p.r, p.r * 2, p.r * 2); ctx.restore(); continue; }
    if (p.chunk) { ctx.save(); ctx.translate(X(p.x), Y(p.y)); ctx.rotate(p.rot); ctx.fillRect(-p.r, -p.r * .35, p.r * 2, p.r * .7); ctx.restore(); }
    else ctx.fillRect(X(p.x) - p.r / 2, Y(p.y) - p.r / 2, p.r, p.r);
  }
  for (const r of g.rings) {
    const k = Math.max(0, 1 - r.life / .8); ctx.globalAlpha = Math.max(0, r.life); ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 3;
    ctx.beginPath();
    if (r.ground) ctx.ellipse(X(r.x), Y(r.y), 10 + k * 120, 3 + k * 14, 0, 0, 7);
    else ctx.arc(X(r.x), Y(r.y), 10 + k * 160, 0, 7);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
  for (const p of g.pops) {
    ctx.globalAlpha = Math.min(1, p.life * 1.5); ctx.textAlign = 'center';
    ctx.font = `400 ${Math.round(18 * p.size)}px ${getVar('--f-display')}`;
    ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(17,20,23,.85)'; ctx.strokeText(p.text, X(p.x), Y(p.y));
    ctx.fillStyle = p.c; ctx.fillText(p.text, X(p.x), Y(p.y));
  }
  ctx.globalAlpha = 1;
  ctx.restore();
  if (T().tint) { ctx.fillStyle = T().tint; ctx.fillRect(0, 0, W, H); }
  const vg = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * .35, W / 2, H / 2, Math.max(W, H) * .75);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.28)');
  ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
  if (g.streaks.length) {
    ctx.save(); ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineWidth = 1.5;
    for (const st of g.streaks) { ctx.globalAlpha = Math.min(1, st.life * 2); ctx.beginPath(); ctx.moveTo(st.x, st.y); ctx.lineTo(st.x + Math.cos(st.a) * st.len, st.y + Math.sin(st.a) * st.len); ctx.stroke(); }
    ctx.restore();
  }
  if (g.course === 'ice') {
    ctx.fillStyle = 'rgba(255,255,255,.75)';
    for (const f of SNOW) { ctx.beginPath(); ctx.arc(f.x * W, f.y * H, f.r, 0, 7); ctx.fill(); }
  }
  if (g.flash > 0) { ctx.fillStyle = `rgba(${g.flashC || '255,255,255'},${RM ? g.flash * .3 : g.flash})`; ctx.fillRect(0, 0, W, H); }
  // 溜めすぎ発射：画面が二重にぶれる
  if (g.ghostFx > 0 && !RM) {
    ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = g.ghostFx * .5;
    const d = g.ghostFx * 26;
    ctx.drawImage(cv, -d, 0, W, H); ctx.globalAlpha = g.ghostFx * .3; ctx.drawImage(cv, d * .6, d * .3, W, H); ctx.restore();
  }
  drawConfetti();
  drawBanner();
  drawHUD();
}

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  update(dt); render();
  requestAnimationFrame(frame);
}
syncUI();
// 初期カメラを全景に合わせる
g.cam = { sx: W / (COURSE.end + 70), sy: H / 125, left: -30, bottom: -32 };
requestAnimationFrame(frame);
})();
</script>
